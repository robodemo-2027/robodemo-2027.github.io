<svg xmlns="http://www.w3.org/2000/svg" class="detail-encoding-scene" viewBox="0 0 760 715" data-mobile-viewbox="0 0 360 1020" role="img" aria-labelledby="de-title de-desc">
  <title id="de-title">One reference segment, two complementary frame samplers</title>
  <desc id="de-desc">A single reference segment supplies two groups of real frames. Sparse semantic frames from across the segment enter qwen3-vl-vision-tower. A dense slice of consecutive frames from that same segment enters v-jepa2-encoder. Separate Q-formers resample the two token streams before gated fusion. Shown frame counts and sample positions are illustrative, not configured model parameters. The historical 240k protocol is documented separately.</desc>
  <defs>
    <marker id="de-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8" fill="#96766A"/></marker>
    <clipPath id="de-photo" clipPathUnits="objectBoundingBox"><rect width="1" height="1" rx=".08"/></clipPath>
    <g id="de-token"><rect x="-7" y="-7" width="14" height="14" rx="4"/></g>
  </defs>
  <style>.detail-encoding-scene text{font-family:Source,'Avenir Next',sans-serif;fill:#49332F;font-size:17px}.detail-encoding-scene .de-small{font-size:12px;fill:#806860}.detail-encoding-scene .de-tiny{font-size:10px;fill:#806860}.de-title{font-weight:650}.de-line{fill:none;stroke:#B49B91;stroke-width:1.7;marker-end:url(#de-arrow)}.de-sampling-line{stroke-dasharray:4 4}.detail-encoding-scene [data-sample-frame]{transition:opacity .2s}.detail-encoding-scene .de-panel{stroke-width:1}.detail-encoding-scene [data-steps]{opacity:1}</style>
