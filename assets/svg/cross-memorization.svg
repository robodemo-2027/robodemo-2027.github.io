<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250"><title>Context writes. Actions read.</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#75564E"/></marker></defs><style>text{font-family:'Avenir Next',sans-serif;font-size:18px;fill:#49332F}.small{font-size:14px;fill:#75564E}</style><rect width="860" height="250" rx="12" fill="#F6EDE6"/><g fill="#fffefa" stroke="#E8D5D0"><rect x="24" y="35" width="213" height="69" rx="10"/><rect x="330" y="68" width="214" height="110" rx="10" fill="#e9e1ee"/><rect x="630" y="137" width="207" height="69" rx="10"/></g><text x="42" y="65">Context tokens</text><text x="42" y="87" class="small">K / V projections</text><text x="359" y="107">Small fast state</text><text x="353" y="137" class="small">Self-supervised inner loss</text><text x="654" y="166">Action-side tokens</text><text x="654" y="190" class="small">Q / O projections</text><path d="M237 69H289V108H323" fill="none" stroke="#75564E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M630 171H592V140H551" fill="none" stroke="#75564E" stroke-width="2" marker-end="url(#a)"/><text x="258" y="51" class="small">WRITE</text><text x="559" y="208" class="small">READ ONLY</text><text x="24" y="234" class="small">Independent reference and progress states. Slow weights and projections stay fixed during deployment.</text></svg>
