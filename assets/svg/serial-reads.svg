<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190"><title>Serial reads, not parallel residuals</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#75564E"/></marker></defs><style>text{font-family:'Avenir Next',sans-serif;font-size:17px;fill:#49332F}.small{font-size:13px;fill:#75564E}</style><rect width="860" height="190" rx="12" fill="#F6EDE6"/><g stroke="#E8D5D0"><rect x="24" y="58" width="160" height="64" rx="9" fill="#fffefa"/><rect x="235" y="58" width="174" height="64" rx="9" fill="#eee5fa"/><rect x="460" y="58" width="174" height="64" rx="9" fill="#fce5ef"/><rect x="685" y="58" width="150" height="64" rx="9" fill="#fffefa"/></g><g text-anchor="middle"><text x="104" y="96">Attention</text><text x="322" y="96">Retrieval read</text><text x="547" y="96">Execution read</text><text x="760" y="96">FFN</text><text x="322" y="37" class="small">Protected intent</text><text x="547" y="37" class="small">Actual progress</text><text x="430" y="160" class="small">Execution refines the reference-conditioned action representation. It never rewrites reference memory.</text></g><g stroke="#75564E" stroke-width="2" marker-end="url(#a)"><path d="M184 90h44"/><path d="M409 90h44"/><path d="M634 90h44"/></g></svg>
